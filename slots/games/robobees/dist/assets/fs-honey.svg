<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="Free spins">
  <defs>
    <!-- Both reservoirs share a fill level. The deep charcoal seam keeps the two letters legible. -->
    <path id="fs-casting" d="M22 10 H82 L78 32 H45 L42 46 H69 L65 66 H39 L32 105 H7 Z M99 10 H148 Q154 10 153 16 L149 33 H107 Q103 33 102 37 Q101 40 105 42 L130 52 Q144 58 141 75 L138 87 Q134 105 117 105 H67 L71 82 H111 Q116 82 117 78 Q118 74 112 71 L88 61 Q75 55 78 41 L81 28 Q85 10 99 10 Z"/>
    <mask id="fs-wall" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="120">
      <rect width="160" height="120" fill="white"/><use href="#fs-casting" fill="black"/>
    </mask>
    <clipPath id="fs-cavity"><use href="#fs-casting"/></clipPath>
    <linearGradient id="fs-metal" x1="0" x2=".35" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff5d8"/><stop offset=".17" stop-color="#e6cea0"/><stop offset=".34" stop-color="#6f5b46"/><stop offset=".53" stop-color="#f4e5be"/><stop offset=".74" stop-color="#aaa18a"/><stop offset="1" stop-color="#413931"/>
    </linearGradient>
    <linearGradient id="fs-empty" x1="0" y1="0" x2=".4" y2="1">
      <stop stop-color="#ffefc4" stop-opacity=".75"/><stop offset=".22" stop-color="#d5c39f" stop-opacity=".43"/><stop offset=".42" stop-color="#a59070" stop-opacity=".23"/><stop offset=".69" stop-color="#4d4035" stop-opacity=".3"/><stop offset="1" stop-color="#997857" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="fs-nectar" gradientUnits="userSpaceOnUse" x1="0" y1="42" x2="10" y2="110">
      <stop stop-color="#fff181"/><stop offset=".10" stop-color="#ffcc31"/><stop offset=".32" stop-color="#ffa30c"/><stop offset=".65" stop-color="#f47703"/><stop offset=".91" stop-color="#d54a04"/><stop offset="1" stop-color="#923405"/>
    </linearGradient>
    <linearGradient id="fs-glint" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#fff" stop-opacity=".75"/><stop offset=".5" stop-color="#fff5d1" stop-opacity=".10"/><stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fs-rim" x1="0" y1="0" x2=".55" y2="1">
      <stop stop-color="#fffdf0"/><stop offset=".19" stop-color="#f6eed8"/><stop offset=".34" stop-color="#69543e"/><stop offset=".6" stop-color="#ebc689"/><stop offset=".82" stop-color="#77522a"/><stop offset="1" stop-color="#eabd72"/>
    </linearGradient>
  </defs>
  <g class="fs-shell">
    <g mask="url(#fs-wall)">
      <use href="#fs-casting" transform="translate(0 5)" fill="#4b2912" stroke="#241c17" stroke-width="6" stroke-linejoin="round"/>
      <use href="#fs-casting" transform="translate(0 2)" fill="#84572e" stroke="url(#fs-metal)" stroke-width="4.7" stroke-linejoin="round"/>
    </g>
    <use href="#fs-casting" fill="url(#fs-empty)" stroke="#493827" stroke-width="1.8" stroke-linejoin="round"/>
    <g clip-path="url(#fs-cavity)">
      <g class="fs-slosh"><g class="fs-surface">
        <path d="M-55 43 Q-26 35 4 42 T66 42 T128 42 T190 42 T252 42 V152 H-55Z" fill="#e69621"/>
        <path d="M-55 47 C-32 53 -11 50 4 46 S39 39 64 46 S106 50 128 45 S170 40 193 46 S228 50 252 46 V152 H-55Z" fill="url(#fs-nectar)"/>
        <path d="M-55 47 C-32 53 -11 50 4 46 S39 39 64 46 S106 50 128 45 S170 40 193 46 S228 50 252 46" fill="none" stroke="#fff6a7" stroke-width="2.4"/>
        <path d="M17 91 Q20 84 23 74 M99 97 Q112 99 127 90" fill="none" stroke="#ffe479" opacity=".57" stroke-width="2.4" stroke-linecap="round"/>
        <g class="fs-bubbles" fill="#b95804" fill-opacity=".58" stroke="#ffde64" stroke-width="1.1">
          <ellipse cx="26" cy="81" rx="2.3" ry="2.7"/><ellipse cx="105" cy="90" rx="3" ry="2.6"/><circle cx="120" cy="69" r="1.6"/>
        </g>
      </g></g>
      <path d="M26 13 H79 L78 17 Q52 19 38 30 L19 52 Z M97 13 H150 L148 18 Q122 17 97 30 L84 37 Q87 17 97 13Z" fill="url(#fs-glint)"/>
      <path d="M18 63 L24 32 M84 42 L87 30" fill="none" stroke="#fff8db" stroke-width="2.2" opacity=".66" stroke-linecap="round"/>
      <use href="#fs-casting" fill="none" stroke="#4b351d" stroke-width="5" opacity=".40" stroke-linejoin="round"/>
      <use href="#fs-casting" fill="none" stroke="url(#fs-rim)" stroke-width="2.3" stroke-linejoin="round"/>
    </g>
    <path d="M24 10.3 H74 M100 10.3 H144 M73.5 82.6 H104" fill="none" stroke="#fffae2" opacity=".87" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
