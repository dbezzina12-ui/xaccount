<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181a1b"><title>RoboBees · Gamboligy Games</title><link rel="stylesheet" href="game.css?v=7"><link rel="stylesheet" href="studio-shop.css"><link rel="stylesheet" href="presentation.css?v=12"><link rel="preload" as="image" href="assets/queen-vault.webp"></head><body>
<canvas id="swarm-stinger" hidden aria-hidden="true"></canvas>

 <div class="award-stage">

 </div>
