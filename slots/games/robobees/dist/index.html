<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181a1b"><title>RoboBees · Gamboligy Games</title><link rel="stylesheet" href="game.css?v=17.4"><link rel="stylesheet" href="studio-shop.css"><link rel="stylesheet" href="presentation.css?v=17.3"></head><body>
<picture class="grove-backdrop" aria-hidden="true"><img src="assets/woodland-clearing.webp" alt="" fetchpriority="high"></picture>
<canvas id="swarm-stinger" hidden aria-hidden="true"></canvas>
<div class="camera-window"><div id="camera-track"><div id="play-stage"><header><b><i>⬢</i> GAMBOLIGY <em>GAMES</em></b><span><i class="led"></i> PLAYTEST &nbsp; / &nbsp; 01</span></header>
<main><div class="machine"><div class="top">
 <div class="brand"><small>APIS INDUSTRIES &nbsp;/&nbsp; RB–05</small><h1><picture><source media="(min-width:700px) and (orientation:landscape)" width="290" height="161" srcset="assets/robobees-stacked.svg"><img src="assets/robobees-wordmark.svg?v=16" alt="RoboBees" width="530" height="93"></picture></h1></div>
 <div class="hive-tree" aria-hidden="true"><img class="oak" src="assets/hollow-oak.webp" alt=""><div id="mascot-stage"></div><img class="oak-sill" src="assets/hollow-oak.webp" alt=""></div>
</div>
<div class="cab"><div class="rail"><span id="mode">FACTORY SHIFT</span><span id="meter">20 PAYLINES</span></div><div id="bonus-hud" hidden>
 <div id="wild-dock" class="instrument"><div class="hive-icon"><img src="assets/hive.webp" alt=""><i id="hive-port"></i></div><div class="instrument-label"><small>WILD BANK</small><span>FINAL SPIN</span></div><output id="bank-count" aria-label="Banked Wilds">0</output></div>

</div><div id="board" role="img" aria-label="Five reels, four rows"></div><div class="strip"></div></div>
<div id="notice" role="status">Connect three or more symbols from the left.</div>
<button id="preview-stinger" hidden>▶ Play bonus stinger</button>
<footer id="controller" aria-label="Game controller"></footer></div></main></div>
<section id="bonus-intro" role="region" inert aria-labelledby="award-title" aria-describedby="award-rules">
 <div class="award-stage">
  <div class="award-copy">
   <img class="award-illustration" src="assets/swarm-print.svg" width="440" height="222" alt="">

   <h2 id="award-title"><span class="award-count">10</span> <span id="award-tier"></span></h2>
   <div id="charge-key"><div id="charge-map" aria-hidden="true"></div><span id="charge-caption"></span></div>
   <p id="award-rules"></p><button id="start-feature">Start free spins <span aria-hidden="true">▶</span></button>
   <a id="replay-stinger" href="?preview=stinger" hidden>↻ Replay stinger</a>

 </div>
</section></div></div>

 <div class="shop-tabs" aria-label="Shop sections"><button data-tab="features">Feature spins</button><button data-tab="buys">Bonus buys</button></div>
