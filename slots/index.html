<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0820">
  <title>Slots</title>
  <link rel="stylesheet" href="engine/client/style.css">
</head>
<body>
  <script type="module">
    import { boot } from './engine/client/main.js';
    const requested = new URL(location.href);
    if (requested.searchParams.get('game') === 'cyber-skunk') {
      // Cyber Skunk ships its own runtime rather than a legacy model.json.
      const target = new URL('./games/cyber-skunk/runtime/index.html', location.href);
      requested.searchParams.delete('game');
      target.search = requested.search;
      target.hash = requested.hash;
      location.replace(target.href);
    } else {
      boot({ game: 'game-001' });
    }
  </script>
</body>
</html>
