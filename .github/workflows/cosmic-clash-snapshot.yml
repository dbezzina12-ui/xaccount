name: Import pinned Cosmic Clash release once
on:
  push:
    branches: [codex/cosmic-clash]
    paths: ['.github/workflows/cosmic-clash-snapshot.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.event.head_commit.message == 'Materialize the verified Cosmic Clash release on the handoff branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Restore verified released files
        run: python3 slots/games/cosmic-clash/scripts/restore-release.py
      - name: Save only the restored game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f slots/games/cosmic-clash/dist
          git rm .github/workflows/cosmic-clash-snapshot.yml
          git commit -m 'Check in verified Cosmic Clash release files'
          git push origin HEAD:refs/heads/codex/cosmic-clash
